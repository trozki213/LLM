# The design's acceptance criteria are only real if something runs them. This is that
# something: the test suite, the branch-coverage floor, and the architectural contracts
# that keep the domain a kernel and keep the explanation layer away from the arithmetic.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests and branch coverage
        run: |
          coverage run -m pytest
          coverage report

      # C1 and C5, checked by the tool rather than by review: the domain imports nothing
      # from the project but itself, subsystems stay independent, and fitkit.explanation
      # cannot reach fitkit.fit_engine.
      - name: Architectural contracts
        run: lint-imports

  no-llm:
    # C2, end to end: the anthropic package is deliberately absent here. If the suite
    # needs an LLM to pass, the fallback is decorative and this job fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -c "import importlib.util, sys; sys.exit(1) if importlib.util.find_spec('anthropic') else None"
      - run: pytest
