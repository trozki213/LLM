[project]
name = "fitkit"
version = "0.1.0"
description = "Garment size prediction: deterministic fit engine with explicit measurement uncertainty."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  # import-linter earns its place from Phase 4, when a second package exists
  # for the layer contract to constrain. Declared now so the dev env is stable.
  "import-linter>=2",
  "coverage>=7",
]
# The LLM is opt-in (ADR-008): with no client the system renders through the template,
# which is complete on its own. This extra exists so the install hint in
# fitkit.explanation.anthropic_client names a command that actually works.
llm = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["src/fitkit"]

[tool.coverage.report]
# The suite runs with no network and no database, so anything genuinely unreachable is
# a defect rather than an untestable path. Branch coverage stands at 98.1%; the floor is
# one point below so the gate catches a regression without failing on a single line.
fail_under = 97
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if typing.TYPE_CHECKING:",
  "\\.\\.\\.$",
]
